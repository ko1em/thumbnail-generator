<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>サムネイル生成テスト</title>

  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <main>

    <h1>サムネイル生成テスト</h1>

    <section class="controls">

      <!-- 背景画像 -->
      <label>
        背景画像
        <select id="backgroundSelect">
          <option value="">背景を選択</option>
        </select>
      </label>

      <!-- テキスト -->
      <label>
        テキスト
        <input
          id="textInput"
          type="text"
          value="INK WAVE"
        >
      </label>

      <!-- X座標 -->
      <label>
        X座標
        <input
          id="xInput"
          type="number"
          value="120"
          min="0"
          max="1920"
        >
      </label>

      <!-- Y座標 -->
      <label>
        Y座標
        <input
          id="yInput"
          type="number"
          value="540"
          min="0"
          max="1080"
        >
      </label>

      <!-- 回転角度 -->
      <label>
        回転角度
        <input
          id="rotationInput"
          type="number"
          value="0"
          min="-180"
          max="180"
        >
      </label>

      <!-- 文字サイズ -->
      <label>
        文字サイズ
        <input
          id="fontSizeInput"
          type="number"
          value="100"
          min="1"
          max="500"
        >
      </label>

      <button id="downloadButton" type="button">
        PNGをダウンロード
      </button>

    </section>

    <section class="preview">
      <canvas
        id="canvas"
        width="1920"
        height="1080"
      ></canvas>
    </section>

  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
